name: Interest Report

on:
  schedule:
    # 매일 07:30 KST = 전날 22:30 UTC. GitHub 는 정각 예약을 몰아서 처리해 몇 시간씩 늦어질 수 있어
    # 정각을 피하고 30분 당겨 둔다 (실측: 23:00 예약이 01:11 에 시작).
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      no_summary:
        description: "Claude 요약 생략 (수집만)"
        type: boolean
        default: false
      kopis_full_sync:
        description: "KOPIS 공연 장부 전체 동기화 (장부를 처음 만들거나 다시 맞출 때)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: interest-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
          KOPIS_FULL_SYNC: ${{ inputs.kopis_full_sync && '1' || '' }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          FLAGS="--email"
          if [ "${{ inputs.no_summary }}" = "true" ]; then FLAGS="$FLAGS --no-summary"; fi
          uv run assistant report $FLAGS

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ data/
          if git diff --cached --quiet; then
            echo "변경된 리포트가 없습니다."
            exit 0
          fi
          git commit -m "report: $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
