# 리포트로 받아볼 관심사 목록.
# 각 항목은 name(제목), sources(수집 소스 목록)로 구성됩니다.
# source.type 은 src/assistant/sources/ 에 등록된 수집기 이름입니다. 현재 지원: rss
interests:
  - name: AI / LLM
    sources:
      - type: rss
        url: https://github.blog/ai-and-ml/feed/
      - type: rss
        url: https://hnrss.org/newest?q=LLM&points=50
  - name: Python
    sources:
      - type: rss
        url: https://planetpython.org/rss20.xml

# 각 소스에서 최대 몇 개 항목을 가져올지
max_items_per_source: 10
