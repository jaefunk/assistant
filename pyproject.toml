[project]
name = "assistant"
version = "0.1.0"
description = "GitHub Actions 로 정기 실행되는 관심사 정보 리포트 서비스"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "markdown>=3.11.1",
    "pyyaml>=6.0",
]

[project.scripts]
assistant = "assistant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
